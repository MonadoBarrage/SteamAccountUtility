# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Creating New Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal
      
      - name: Publish Windows x64
        run: dotnet publish -c Release -r win-x64

      - name: Publish Linux x64
        run: dotnet publish -c Release -r linux-x64
          
      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Packaging/Windows/InnoSetup.iss
          options: /O+


      - name: Move Linux Packaging Files
        shell: bash
        run: mv Packaging/Linux/* bin/Release/net10.0/linux-x64/publish/
        
      - name: Upload Window artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-x64_package
          path: Packaging/Windows/Output
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64_package
          path: bin/Release/net10.0/linux-x64/publish

      - name: Upload Changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md
          
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-x64_package
          path: linux-x64/
      
      - name: Fetch Windows package
        uses: actions/download-artifact@v8
        with:
          name: win-x64_package
          path: win-x64

      - name: Fetch changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog
      
      - name: Zip Linux archive
        run: zip -r linux-x64.zip linux-x64/*
        
      - name: Zip Windows archive
        run: zip -r win-x64.zip win-x64/*
        
      - name: Create a new release
        uses: softprops/action-gh-release@v3
        with: 
          body_path: CHANGELOG.md
          files: |
            win-x64.zip
            linux-x64.zip
